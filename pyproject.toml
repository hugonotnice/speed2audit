[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speed2audit"
version = "0.1.0"
description = "Open-core mystery shopper and auditing platform for WhatsApp customer service and sales channels."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Hugo Soares" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Communications",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "chainlit>=1.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-google-genai>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.0",
    "arize-phoenix>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/hugonotnice/speed2audit"
Repository = "https://github.com/hugonotnice/speed2audit"
Issues = "https://github.com/hugonotnice/speed2audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/speed2audit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-api>=0.11.0",
]
